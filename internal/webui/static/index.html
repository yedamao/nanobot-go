<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nanobot-go</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-state="connecting">
<aside id="sidebar" aria-label="Chats">
  <button id="new-chat" type="button" title="Start a new session">New chat</button>
  <ul id="chats"></ul>
</aside>
<div id="chat">
<header>
  <button id="toggle-chats" type="button" title="Show the chat list" aria-controls="sidebar" aria-expanded="false">Chats</button>
  <h1>nanobot-go</h1>
  <span id="status" class="status" data-state="connecting">Connecting…</span>
  <button id="show-status" type="button" title="Show the gateway status" aria-controls="status-panel">Status</button>
</header>
<main id="messages" aria-live="polite"></main>
<form id="composer" autocomplete="off">
  <textarea id="input" rows="1" placeholder="Message nanobot (Enter to send, Shift+Enter for a new line)" required></textarea>
  <button id="stop" type="button" title="Stop the reply in progress" hidden>Stop</button>
  <button id="send" type="submit" disabled>Send</button>
</form>
</div>
<dialog id="status-panel" aria-labelledby="status-title">
  <h2 id="status-title">Gateway status</h2>
  <dl id="status-list"></dl>
  <p class="status-note">What the gateway is running with now.</p>
  <form id="settings-form" autocomplete="off">
    <h3>Settings</h3>
    <fieldset id="settings-fields" disabled>
      <label>Model <input id="set-model" type="text" maxlength="200" spellcheck="false" required></label>
      <label>Provider <select id="set-provider"></select></label>
      <label class="check"><input id="set-exec" type="checkbox"> exec tool</label>
      <label class="check"><input id="set-web-fetch" type="checkbox"> web_fetch tool</label>
      <label>Exec sandbox <select id="set-exec-sandbox"></select></label>
      <div id="set-channels"></div>
    </fieldset>
    <p class="status-note">Saved to config.json; the gateway uses saved settings after a restart. Keys, tokens and allow lists are edited in config.json only.</p>
    <p id="settings-message" class="status-note" role="status"></p>
    <div class="status-actions">
      <button id="save-settings" type="submit" disabled>Save</button>
      <button id="refresh-status" type="button">Refresh</button>
      <button id="close-status" type="button">Close</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
