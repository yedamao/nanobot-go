<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nanobot-go</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-state="connecting">
<aside id="sidebar" aria-label="Chats">
  <button id="new-chat" type="button" title="Start a new session">New chat</button>
  <ul id="chats"></ul>
</aside>
<div id="chat">
<header>
  <button id="toggle-chats" type="button" title="Show the chat list" aria-controls="sidebar" aria-expanded="false">Chats</button>
  <h1>nanobot-go</h1>
  <span id="status" class="status" data-state="connecting">Connecting…</span>
  <button id="show-status" type="button" title="Show the gateway status" aria-controls="status-panel">Status</button>
</header>
<main id="messages" aria-live="polite"></main>
<form id="composer" autocomplete="off">
  <textarea id="input" rows="1" placeholder="Message nanobot (Enter to send, Shift+Enter for a new line)" required></textarea>
  <button id="stop" type="button" title="Stop the reply in progress" hidden>Stop</button>
  <button id="send" type="submit" disabled>Send</button>
</form>
</div>
<dialog id="status-panel" aria-labelledby="status-title">
  <h2 id="status-title">Gateway status</h2>
  <dl id="status-list"></dl>
  <p class="status-note">Read-only. Change settings in config.json and restart the gateway.</p>
  <div class="status-actions">
    <button id="refresh-status" type="button">Refresh</button>
    <button id="close-status" type="button">Close</button>
  </div>
</dialog>
<script src="app.js"></script>
</body>
</html>
